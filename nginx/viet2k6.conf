server {                                                                                                                                                   
        listen 8080;                                                                                                                                           
        listen [::]:8080; # Điểm IPv6                                                                                                                          
        server_name 221.121.4.35;                                                                                                                              
                                                                                                                                                               
        root /var/www/devops-hackathon-de002-viet2k6/src;                                                                                                      
        index index.html;                                                                                                                                      
                                                                                                                                                               
        # Điểm log riêng                                                                                                                                       
        access_log /var/log/nginx/viet2k6.access.log;                                                                                                          
        error_log /var/log/nginx/viet2k6.error.log;                                                                                                            
                                                                                                                                                               
        location / {                                                                                                                                           
            allow all; # Điểm allow all                                                                                                                        
            try_files $uri $uri/ =404;                                                                                                                         
        }                                                                                                                                                      
    }                                                                  
